# ============================================================
# DigiWP Ai Support — Coolify deployment
# ------------------------------------------------------------
# Three parts, one stack:
#   • server  — the واسط server (Node + SQLite)         [internal]
#   • hub     — the panel / main site (React via nginx)  [public]  ← نصب اصلی
#   • demo    — a real WordPress site + DB to pair with  [public]  ← دمو
#
# On Coolify: the `SERVICE_FQDN_*` vars make Coolify generate domains and
# route its proxy to the right container. Set AUTH_SECRET in the app's env.
# The hub serves the UI and proxies /api → server, so it's one origin.
#
# Local run (no Coolify):  AUTH_SECRET=dev docker compose up --build
#   then open the hub on the port you map (see the note near `hub.ports`).
# ============================================================

services:
  # ---- PostgreSQL — the hub's database ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=digiwp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-digiwp}
      - POSTGRES_DB=digiwp
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiwp -d digiwp"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- the واسط server (only backend the hub talks to) ----
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      # Coolify: give the واسط API its own public domain, routed to port 8787.
      # (Health at <server-domain>/health, API under <server-domain>/v1.)
      - SERVICE_FQDN_SERVER_8787
      - PORT=8787
      - DATABASE_URL=postgres://digiwp:${POSTGRES_PASSWORD:-digiwp}@db:5432/digiwp
      - AUTH_SECRET=${AUTH_SECRET:-please-change-this-secret}
      - CORS_ORIGIN=*
      # Turn on live relay so paired sites are driven for real:
      - LIVE=1
      # Daily security digest to Telegram (set these in Coolify env; blank = disabled).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DIGEST_HOUR=${DIGEST_HOUR:-8}
      # --- Reaching the SITE OWNER when their site is compromised ---
      #
      # An emergency (malware, a modified core, a site that is down) is
      # dispatched to the owner over these channels, in order, until one is
      # accepted. Every one is optional and an unset channel is skipped rather
      # than failed — which means leaving them all blank is a valid deployment
      # in which the owner is never told anything. The operator still hears
      # about it on TELEGRAM_CHAT_ID above, and the server says which channels
      # are live at startup so this is a choice rather than a surprise.
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      - NAJVA_API_KEY=${NAJVA_API_KEY:-}
      # Iranian SMS gateways all differ, so the field names are configuration
      # rather than code. SMS_URL and SMS_API_KEY are the minimum.
      - SMS_URL=${SMS_URL:-}
      - SMS_API_KEY=${SMS_API_KEY:-}
      - SMS_AUTH_HEADER=${SMS_AUTH_HEADER:-}
      - SMS_TO_FIELD=${SMS_TO_FIELD:-to}
      - SMS_TEXT_FIELD=${SMS_TEXT_FIELD:-text}
      - SMS_FROM_FIELD=${SMS_FROM_FIELD:-from}
      # EMAIL_URL is the one that matters most here: every account has an email
      # address, and none has a phone or a push token.
      - EMAIL_URL=${EMAIL_URL:-}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-alerts@digiwp.com}
      # Public URL a connector uses to reach us = the server's own domain + /v1.
      - PUBLIC_BASE_URL=${SERVICE_URL_SERVER:-http://localhost:8787}/v1
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8787"

  # ---- the panel / main site (this is your primary install) ----
  hub:
    build:
      context: ./hub
    restart: unless-stopped
    environment:
      # Coolify: generate a domain for the hub, routed to its port 80.
      - SERVICE_FQDN_HUB_80
    depends_on:
      - server
    expose:
      - "80"
    # No host `ports:` here — on Coolify, routing is via its proxy (the
    # SERVICE_FQDN_HUB_80 var above). For local access, docker-compose.override.yaml
    # publishes a host port (auto-merged by `docker compose up`, ignored by Coolify).

  # ---- demo WordPress (a real managed site to pair with the hub) ----
  demo-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=wordpress
      - MARIADB_USER=wordpress
      - MARIADB_PASSWORD=${DEMO_DB_PASSWORD:-wordpress}
      - MARIADB_ROOT_PASSWORD=${DEMO_DB_ROOT_PASSWORD:-rootpw}
    volumes:
      - demo-db:/var/lib/mysql

  demo:
    build:
      context: .
      dockerfile: deploy/demo.Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_DEMO_80
      - WORDPRESS_DB_HOST=demo-db
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${DEMO_DB_PASSWORD:-wordpress}
      # Make WordPress aware of its public URL behind the proxy.
      - |
        WORDPRESS_CONFIG_EXTRA=
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('WP_HOME', getenv('SERVICE_URL_DEMO') ?: 'http://localhost:8081');
        define('WP_SITEURL', getenv('SERVICE_URL_DEMO') ?: 'http://localhost:8081');
    volumes:
      - demo-wp:/var/www/html
      # The plugin is baked into the image (deploy/demo.Dockerfile) rather than
      # bind-mounted from here. A bind mount resolves relative to wherever
      # compose is run, which is a checkout locally and Coolify's application
      # directory in production — and a missing bind source is not an error to
      # Docker, it is a directory to create. That is how the demo ended up with
      # a FOLDER named wp-claude-bridge.php and no plugin, silently, for weeks.
    depends_on:
      - demo-db
    expose:
      - "80"
    # No host `ports:` (see the hub note) — Coolify routes via SERVICE_FQDN_DEMO_80.

volumes:
  pg-data:
  demo-db:
  demo-wp:
