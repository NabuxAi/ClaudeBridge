<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>DigiWP AI - ویدیو رسمی معرفی</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    h1 {
      margin-top: 0;
      font-size: 1.75rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      font-size: 0.8rem;
      background: #0284c7;
      color: white;
      padding: 4px 10px;
      border-radius: 9999px;
    }
    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      outline: none;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .meta-card {
      background: #0f172a;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .meta-title {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .meta-val {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span>DigiWP · ویدیوی معرفی سیستم هوش مصنوعی وردپرس</span>
      <span class="badge">60 FPS · 1080p</span>
    </h1>
    <video controls autoplay poster="digiwpLaunch-16x9.poster.png">
      <source src="digiwpLaunch-16x9.mp4" type="video/mp4">
      <track kind="subtitles" src="digiwpLaunch-16x9.vtt" srclang="fa" label="فارسی" default>
      مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
    </video>
    <div class="meta-grid">
      <div class="meta-card">
        <div class="meta-title">طول و فریم‌ریت</div>
        <div class="meta-val">۳۲ ثانیه (۱۹۲۰ فریم @ ۶۰fps)</div>
      </div>
      <div class="meta-card">
        <div class="meta-title">سبک انیمیشن</div>
        <div class="meta-val">Clean Modern Flat Vector</div>
      </div>
      <div class="meta-card">
        <div class="meta-title">موسیقی اورجینال</div>
        <div class="meta-val">DigiWpPulse (F Major · 90 BPM)</div>
      </div>
      <div class="meta-card">
        <div class="meta-title">وضعیت اعتبارسنجی فنی</div>
        <div class="meta-val" style="color: #4ade80;">۱۰۰٪ پاس شده (16/16 Checks)</div>
      </div>
    </div>
  </div>
</body>
</html>
