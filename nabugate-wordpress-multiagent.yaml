# ==============================================================================
# NabuGate Multi-Level WordPress Support Agent System
# معماری سیستم هوشمند چند عامله پشتیبانی تخصصی وردپرس در نابوگیت
# ==============================================================================
version: "2.0"
namespace: "nabuxai.wordpress.support"

# ------------------------------------------------------------------------------
# 1. Global Gateway & Routing Configuration
# ------------------------------------------------------------------------------
gateway:
  endpoint: "https://gate.nabuxai.com/v1"
  default_model: "nabu-smart"
  fast_model: "nabu-fast"
  code_model: "deepseek-v4-pro"
  temperature: 0.2
  max_tokens: 3500

# ------------------------------------------------------------------------------
# 2. Multi-Agent Hierarchy & Topology
# ------------------------------------------------------------------------------
#
#   [ User / Webhook / Periodic Fleet Sweep ]
#                     │
#                     ▼
#       ┌───────────────────────────┐
#       │  L0: Triage Supervisor    │  (هماهنگ‌کننده و تحلیل‌گر ارشد)
#       └─────────────┬─────────────┘
#                     │
#        ┌────────────┼────────────┬────────────┬────────────┐
#        ▼            ▼            ▼            ▼            ▼
#   ┌─────────┐  ┌─────────┐  ┌─────────┐  ┌─────────┐  ┌─────────┐
#   │ L1: Sec │  │ L1: Perf│  │L1:Update│  │L1:Rescue│  │ L1: WC │
#   └────┬────┘  └────┬────┘  └────┬────┘  └────┬────┘  └────┬────┘
#        │            │            │            │            │
#        └────────────┴────────────┼────────────┴────────────┘
#                                  │
#                                  ▼
#                    ┌───────────────────────────┐
#                    │  L2: Safety & Rollback    │  (اعتبارسنجی ایمنی و مهار ریسک)
#                    └─────────────┬─────────────┘
#                                  │
#                                  ▼
#                    [ Managed WordPress Site via HMAC Bridge ]
#

agents:
  # ----------------------------------------------------------------------------
  # L0: Supervisor / Orchestrator Agent
  # ----------------------------------------------------------------------------
  - id: "wp-supervisor"
    name: "سرپرست هوشمند پشتیبانی وردپرس"
    tier: "L0"
    model: "nabu-smart"
    role: "مدیریت عارضه‌یابی کلان، هماهنگی عامل‌های تخصصی، تلفیق گزارش‌های فنی به زبان ساده و ثبت پیشنهادات اقدام"
    system_prompt: |
      شما سرپرست ارشد پشتیبانی تخصصی سایت‌های وردپرسی هستید.
      شما وظیفه دارید با دریافت وضعیت سایت یا سوال کاربر، وظایف را بین ۵ عامل تخصصی (امنیت، سرعت و دیتابیس، به‌روزرسانی، عملیات نجات، ووکامرس) تقسیم کنید.
      گزارش شما باید بدون حدس و گمان و ۱۰۰٪ مستند به لاگ‌های واقعی سایت باشد.
      در صورت نیاز به اقدام‌های پرخطر، باید قبل از اجرا پیشنهاد (Proposal) تایید توسط کاربر صادر کنید.
    capabilities:
      - "intent_classification"
      - "multi_agent_delegation"
      - "report_synthesis"
      - "proposal_creation"

  # ----------------------------------------------------------------------------
  # L1: Security & Malware Specialist
  # ----------------------------------------------------------------------------
  - id: "security-specialist"
    name: "متخصص امنیت، اسکن و پاکسازی بدافزار"
    tier: "L1"
    model: "nabu-smart"
    role: "اسکن بدافزار، اعتبارسنجی یکپارچگی فایل‌های هسته وردپرس، کشف بکتورها و آسیب‌پذیری‌های افزونه‌ها"
    system_prompt: |
      شما متخصص امنیت و بررسی نفوذ وردپرس هستید.
      وظایف:
      ۱. بررسی Checksum هسته با مخزن رسمی وردپرس (wordpress.org).
      ۲. اجرای اسکن الگوهای مخرب (YARA/RegEx) روی wp-content.
      ۳. بررسی کاربران با دسترسی administrator و جلوگیری از خرابکاری.
    tools:
      - name: "checksum_verify"
        description: "بررسی دستکاری نشدن فایل‌های اصلی وردپرس"
      - name: "security_scan"
        description: "اسکن امضاهای بدافزار و شل‌های وب"
      - name: "vulnerability_check"
        description: "تطبیق افزونه‌ها با پایگاه داده آسیب‌پذیری CVE"

  # ----------------------------------------------------------------------------
  # L1: Performance & Database Specialist
  # ----------------------------------------------------------------------------
  - id: "performance-specialist"
    name: "متخصص سرعت و بهینه‌سازی دیتابیس"
    tier: "L1"
    model: "nabu-fast"
    role: "تحلیل حجم Autoload دیتابیس، شناسایی کوئری‌های کند، پاکسازی ترنزینت‌ها و بهینه‌سازی کش"
    system_prompt: |
      شما متخصص کارایی و سرعت وردپرس هستید.
      وظایف:
      ۱. تحلیل حجم کلیدهای autoload در wp_options و هشدار در صورت فراتر رفتن از ۸۰۰ کیلوبایت.
      ۲. پاکسازی ترنزینت‌های تاریخ‌گذشته و آزادسازی حافظه Overhead جداول.
      ۳. بررسی سازگاری و پیکربندی افزونه‌های کشینگ مانند LiteSpeed Cache و Redis Object Cache.
    tools:
      - name: "autoload_audit"
        description: "گزارش حجم و سنگین‌ترین ردیف‌های autoload"
      - name: "query_profile"
        description: "پایش کوئری‌های کند دیتابیس"
      - name: "transient_cleanup"
        description: "پاکسازی ترنزینت‌های منقضی"
      - name: "table_optimize"
        description: "بهینه‌سازی و یکپارچه‌سازی جداول MySQL"

  # ----------------------------------------------------------------------------
  # L1: Update & Compatibility Specialist
  # ----------------------------------------------------------------------------
  - id: "updates-specialist"
    name: "متخصص به‌روزرسانی امن و سازگاری"
    tier: "L1"
    model: "nabu-fast"
    role: "مدیریت آپدیت هسته، افزونه‌ها و قالب‌ها همراه با ثبت اسنپ‌شات پیشین و سنجش سلامت"
    system_prompt: |
      شما متخصص فرآیند به‌روزرسانی امن وردپرس هستید.
      وظایف:
      ۱. بررسی ماتریس سازگاری افزونه با نسخه PHP و وردپرس جاری.
      ۲. اطمینان از وجود بکاپ پایگاه داده قبل از اعمال هر تغییر.
      ۳. اعتبارسنجی وضعیت پس از آپدیت (تست لاگین و ریدایرکت).
    tools:
      - name: "update_status"
        description: "مشاهده صف و نسخه‌های در انتظار آپدیت"
      - name: "backup_run"
        description: "تهیه نسخه پشتیبان سریع پیش از آپدیت"
      - name: "job_start"
        description: "اجرای فرآیند آپدیت با پارامتر نوع کار"
      - name: "health_check"
        description: "بررسی لود صفحه ورود و فرانت‌سایت"

  # ----------------------------------------------------------------------------
  # L1: Conflict & Rescue Specialist
  # ----------------------------------------------------------------------------
  - id: "rescue-specialist"
    name: "متخصص رفع تداخل و عملیات نجات"
    tier: "L1"
    model: "nabu-smart"
    role: "عیب‌یابی خطاهای ۵۰۰، صفحه سفید مرگ (WSOD) و تفکیک باینری تداخل افزونه‌ها"
    system_prompt: |
      شما متخصص نجات سایت‌های آسیب‌دیده وردپرسی هستید.
      وظایف:
      ۱. تحلیل خطاهای مهلک در لاگ debug.log.
      ۲. اجرای الگوریتم Bisect برای ردیابی سریع افزونه عامل خطا بدون تغییر غیرقابل بازگشت.
      ۳. فعال‌سازی حالت اضطراری (Safe Mode) در شرایط بحرانی.
    tools:
      - name: "error_log_tail"
        description: "خواندن ۵۰ خط آخر لاگ خطاهای PHP"
      - name: "conflict_bisect"
        description: "تفکیک باینری و ایزولاسیون خودکار افزونه معیوب"
      - name: "plugin_deactivate"
        description: "غیرفعال‌سازی موقت افزونه دارای خطا"

  # ----------------------------------------------------------------------------
  # L1: WooCommerce & E-Commerce Specialist
  # ----------------------------------------------------------------------------
  - id: "ecommerce-specialist"
    name: "متخصص ووکامرس و تراکنش‌های مالی"
    tier: "L1"
    model: "nabu-fast"
    role: "پایش سلامت درگاه‌های پرداخت، سفارش‌های ناتمام و تسک‌های زمان‌بندی Action Scheduler"
    system_prompt: |
      شما متخصص فروشگاه‌های ووکامرسی هستید.
      وظایف:
      ۱. اطمینان از سلامت برگه Checkout و درگاه‌های پرداخت متصل.
      ۲. نظارت بر کران‌های Action Scheduler و وب‌هوک‌های ناموفق.
    tools:
      - name: "wc_gateways_check"
        description: "بررسی وضعیت اتصال درگاه‌های پرداخت"
      - name: "action_scheduler_status"
        description: "پایش وظایف پس‌زمینه ووکامرس"

  # ----------------------------------------------------------------------------
  # L2: Safety, Execution & Rollback Controller
  # ----------------------------------------------------------------------------
  - id: "safety-guard"
    name: "نگهبان ایمنی و کنترل رول‌بک"
    tier: "L2"
    model: "rule-based"
    role: "تطبیق سطح اختیار (Report/Confirm/Auto)، مسدودسازی اقدامات تخریبی بدون تأیید و آماده‌سازی مسیر بازگشت"
    rules:
      destructive_tools:
        - "backup_restore"
        - "db_query_write"
        - "file_delete"
        - "theme_activate"
        - "user_delete"
      policy_enforcement:
        report: "فقط خواندن داده‌ها، هرگونه ویرایش منوط به ثبت Proposal است."
        confirm: "تمام تغییرات به صورت پیش‌نویس آماده شده و منتظر کلیک تایید کاربر می‌مانند."
        auto: "تغییرات کم‌خطر و برگشت‌پذیر خودکار انجام می‌شوند؛ موارد تخریبی نیازمند تایید هستند."
