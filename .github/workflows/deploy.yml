name: Deploy

# Nothing in this repository deployed it. Every change this session reached
# production because someone opened Coolify and pressed a button — including the
# plugin releases, where that matters more than usual: sites pull their update
# from the manifest this deployment serves, so an unpushed fix is a fix no site
# can install, which is exactly how 3.7.1 shipped invisible.
#
# Runs after 'CI' passes, so a red build cannot reach production. CI here builds
# the distributables and runs the suite against a real PostgreSQL, so a green
# run means the release checks actually ran rather than skipped.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # For redeploying without a new commit — a changed environment variable, or a
  # rollback that is already in main.
  workflow_dispatch:

concurrency:
  group: deploy-claudebridge
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Deploying after a failed CI run is deploying a broken build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check required configuration
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_API_URL }}
          RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: |
          missing=""
          [ -n "$COOLIFY_TOKEN" ] || missing="$missing COOLIFY_API_TOKEN"
          [ -n "$COOLIFY_URL" ]   || missing="$missing COOLIFY_API_URL"
          [ -n "$RESOURCE_UUID" ] || missing="$missing COOLIFY_RESOURCE_UUID"

          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not set:$missing"
            echo ""
            echo "Settings > Secrets and variables > Actions."
            echo ""
            echo "  COOLIFY_API_URL         https://cp.nabuxai.com/api/v1"
            echo "  COOLIFY_RESOURCE_UUID   aurq5lmwbsfvh2ckr886h056"
            echo "  COOLIFY_API_TOKEN       Coolify > Keys & Tokens > API tokens,"
            echo "                          scoped to deploy this resource"
            echo ""
            echo "The UUID above was read from the running containers serving"
            echo "api.digiwp.com and ai.digiwp.com, not guessed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Deploy and wait for the result
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: ./scripts/coolify-deploy.sh

      # The plugin update channel is the part of this deployment that other
      # machines depend on. A deploy that leaves it serving the previous zip is a
      # deploy that looks finished and ships nothing to any site.
      - name: Check the published manifest matches this commit
        run: |
          published="$(curl --fail --silent --max-time 20 \
            https://api.digiwp.com/v1/plugin/manifest | \
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)"
          expected="$(grep -oE "define\( *'CB_VERSION', *'[^']+'" wp-claude-bridge.php \
            | grep -oE "'[^']+'$" | tr -d "'")"

          echo "published: ${published:-unreadable}"
          echo "in this commit: ${expected:-unreadable}"

          if [ -z "$published" ] || [ -z "$expected" ]; then
            echo "::warning::Could not compare versions, so this says nothing either way."
            exit 0
          fi
          if [ "$published" != "$expected" ]; then
            echo "::error::The deployment finished but the update channel still serves"
            echo "$published while this commit is $expected. Sites poll the manifest and"
            echo "install only what it advertises, so the change has reached the server"
            echo "and not a single site."
            exit 1
          fi
          echo "The update channel is serving this commit."
