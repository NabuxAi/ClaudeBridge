name: CI

# Nothing ran on push. The suite has been passing, but only ever on a laptop
# with a throwaway PostgreSQL started by hand — which is a claim about one
# machine, not about the branch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (node --test)
    runs-on: ubuntu-latest

    # A dozen assertions here are database properties — a partial unique index,
    # a conditional UPDATE that must match exactly one row. Without a real
    # PostgreSQL those files skip, and a green run over skipped tests is the
    # kind of CI that is believed rather than useful.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      # dist/ is generated and gitignored. Building it here is not a
      # convenience: several assertions check that the SHIPPED artifacts carry
      # the version being advertised and contain the fixes claimed for it, and
      # without a build those skip. A release gate that skips the release
      # checks is not a gate.
      - name: Build the distributables
        run: |
          bash scripts/build-digiwp-ai-bridge.sh
          bash scripts/build-wporg-bridge.sh

      - name: Test
        working-directory: server
        env:
          CB_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/cbtest
        run: npm test

      # The plugin ships as PHP and the server's tests read its source, so a
      # syntax error there passes the suite and breaks every paired site.
      - name: Lint the plugin and its builds
        run: |
          for f in wp-claude-bridge.php dist/*/*.php; do
            [ -e "$f" ] || continue
            php -l "$f"
          done

  hub:
    name: Hub (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Install
        working-directory: hub
        run: npm ci

      # The panel is the only client of the server's API. A build failure here
      # is a deploy that serves a stale bundle without saying so.
      - name: Lint
        working-directory: hub
        run: npm run lint

      - name: Build
        working-directory: hub
        run: npm run build
