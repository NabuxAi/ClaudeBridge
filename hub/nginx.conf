server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip static assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Proxy the hub's API calls to the واسط server (same origin, no CORS).
  # /api/auth/login  ->  server:8787/v1/auth/login
  # /api/sites       ->  server:8787/v1/sites
  location /api/ {
    proxy_pass http://server:8787/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 600s timeout so long operations (e.g. backup streaming, deep scans,
    # assistant tool sweeps) do not get truncated mid-flight.
    proxy_read_timeout 600s;
    proxy_buffering off;
    client_max_body_size 2m;
  }

  # The service worker must never be cached. A stale worker keeps serving old
  # push-handling code for as long as its cache entry lives, and the whole
  # point of this one is that an emergency notification arrives today.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
    try_files $uri =404;
  }

  # Needs its own MIME type, or the browser ignores it and the app is not
  # installable.
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # SPA: hashed assets are immutable; everything else falls back to index.html.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
